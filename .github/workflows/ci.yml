name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-drift:
    name: Check dependency version drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Detect major-version mismatches
        run: node scripts/check-version-drift.js

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
            frontend/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: cd backend && npm ci && cd ..
      - run: cd frontend && npm ci && cd ..
      - name: Audit root
        run: node scripts/check-dependency-audit.js .
      - name: Audit backend
        run: node scripts/check-dependency-audit.js backend
      - name: Audit frontend
        run: node scripts/check-dependency-audit.js frontend

  secret-scan:
    name: Scan example files for real-format secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Scan example files for secret material
        run: node scripts/scan-example-secrets.js

  secret-scan-repo:
    name: Scan repository for committed Stellar secret keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Scan tracked files for Stellar secret key material
        run: node scripts/scan-repo-secrets.js

  migrations:
    name: Validate migration numbering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/validate-migrations.js

  orphan-dirs:
    name: Check for stray duplicate directories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-orphan-dirs.js

  error-response-shape:
    name: Check 401/403 response shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-error-response-shape.js

  k8s-ingress-tls:
    name: Verify Kubernetes ingress has TLS configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check ingress TLS block exists
        run: |
          if ! grep -q "tls:" deploy/k8s/ingress.yaml; then
            echo "ERROR: TLS block not found in deploy/k8s/ingress.yaml"
            exit 1
          fi
          echo "✓ TLS block found in ingress configuration"

  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-node-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-node-
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Run ESLint (backend)
        run: cd backend && npx eslint src/ --max-warnings=0

  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Run next lint (frontend)
        run: cd frontend && npm run lint

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Build frontend (next build)
        run: cd frontend && npm run build
      - name: Check bundle budgets
        run: node scripts/bundle-budget.js
      - name: Upload bundle manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-manifest
          path: frontend/.next/build-manifest.json
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    env:
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      MONGO_URI: mongodb://localhost:27017/stellaredupay_test?replicaSet=rs0
      # Dummy secrets required by config/index.js validation before test files can set them.
      JWT_SECRET: ci-test-jwt-secret-not-used-in-production
      SCHOOL_WALLET_ADDRESS: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        # Single-node replica set ("rs0") — REQUIRED. Multi-document MongoDB
        # transactions (payment recording, fee batch apply, TransactionManager)
        # fail against a standalone mongod with "Transaction numbers are only
        # allowed on a replica set member or mongos". The healthcheck runs
        # rs.initiate() on the first probe; the job's steps only start once the
        # service reports healthy (initiated + PRIMARY). The old comment here
        # claimed standalone was "sufficient" — it never was for any code path
        # that opens a session.
        options: >-
          --replSet rs0
          --health-cmd "mongosh --quiet --eval 'try { if (rs.status().ok !== 1) { throw new Error(\"rs not initiated\"); } } catch (e) { try { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"localhost:27017\" }] }); } catch (e2) {} process.exit(1); } if (!db.hello().isWritablePrimary) { process.exit(1); }'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
            frontend/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: cd backend && npm ci && cd ..
      - run: cd frontend && npm ci && cd ..
      - name: Syntax check
        run: npm run check:syntax
      - name: Run migrations against CI MongoDB
        working-directory: backend
        run: npm run migrate
      - run: npm test

  # ── #1389: Test coverage enforcement ───────────────────────────────────────
  # Collects backend (root jest config) and frontend coverage and uploads the
  # reports as downloadable artefacts on every PR, so reviewers can inspect
  # exactly which code paths a change exercises. Per-directory Jest
  # coverageThreshold values are configured in package.json (backend) and
  # frontend/jest.config.js (frontend). Jest exits non-zero when any threshold
  # is breached, so this job is GATING via the ci-gate job below.
  #
  # Threshold ladder (raise incrementally as coverage improves):
  #   - Start: global 46 % branches / 37 % functions / 51 % lines (backend)
  #            global 47 % branches / 22 % functions / 39 % lines (frontend)
  #   - Target: raise each value by ~5 pp per sprint until ≥ 80 % globally.
  coverage:
    name: Test coverage report
    runs-on: ubuntu-latest
    env:
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      MONGO_URI: mongodb://localhost:27017/stellaredupay_test?replicaSet=rs0
      JWT_SECRET: ci-test-jwt-secret-not-used-in-production
      SCHOOL_WALLET_ADDRESS: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        # Single-node replica set ("rs0") — REQUIRED for multi-document MongoDB
        # transactions (payment recording, fee batch apply, TransactionManager).
        # Transactional tests fail against a standalone mongod with "Transaction
        # numbers are only allowed on a replica set member or mongos".
        options: >-
          --replSet rs0
          --health-cmd "mongosh --quiet --eval 'try { if (rs.status().ok !== 1) { throw new Error(\"rs not initiated\"); } } catch (e) { try { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"localhost:27017\" }] }); } catch (e2) {} process.exit(1); } if (!db.hello().isWritablePrimary) { process.exit(1); }'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
            frontend/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm ci
      - run: cd backend && npm ci && cd ..
      - run: cd frontend && npm ci && cd ..

      - name: Backend coverage
        run: npm run coverage

      - name: Frontend coverage
        run: npm run coverage:frontend

      - name: Print risk-area coverage summary
        if: always()
        run: |
          echo "=== Risk-area coverage summary (Issue #100) ==="
          npm run coverage -- --coverageReporters=text --silent 2>/dev/null | \
            grep -E "(All files|services|middleware|controllers|stellarService|authController|webhookService|reconciliation|paymentController|paymentConfirmation)" || true
          echo "================================================"

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage/backend
          retention-days: 14

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/frontend
          retention-days: 14

  docker-build:
    name: Docker image build & smoke test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        # Single-node replica set — same requirement as the test job above.
        options: >-
          --replSet rs0
          --health-cmd "mongosh --quiet --eval 'try { if (rs.status().ok !== 1) { throw new Error(\"rs not initiated\"); } } catch (e) { try { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"localhost:27017\" }] }); } catch (e2) {} process.exit(1); } if (!db.hello().isWritablePrimary) { process.exit(1); }'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t stellaredupay/backend:ci ./backend

      - name: Smoke-test backend container
        run: |
          docker run -d \
            --name backend-ci \
            --network host \
            -e JWT_SECRET=ci-smoke-test-secret \
            -e MONGO_URI=mongodb://localhost:27017/stellaredupay_smoketest?replicaSet=rs0 \
            -e STELLAR_NETWORK=testnet \
            -e SCHOOL_WALLET_ADDRESS=GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5 \
            stellaredupay/backend:ci
          for i in $(seq 1 12); do
            if curl -sf http://localhost:5000/health/live; then
              echo ""
              echo "Backend is live"
              exit 0
            fi
            echo "Waiting for backend to start... ($i/12)"
            sleep 5
          done
          docker logs backend-ci
          echo "Backend failed to start within 60 seconds"
          exit 1

      - name: Build frontend image
        run: docker build -t stellaredupay/frontend:ci ./frontend

      - name: Set immutable image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tag images with commit SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag stellaredupay/backend:ci stellaredupay/backend:${{ steps.meta.outputs.tag }}
          docker tag stellaredupay/frontend:ci stellaredupay/frontend:${{ steps.meta.outputs.tag }}
          echo "Backend:  stellaredupay/backend:${{ steps.meta.outputs.tag }}"
          echo "Frontend: stellaredupay/frontend:${{ steps.meta.outputs.tag }}"

  docker-compose-smoke:
    name: Docker Compose stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether compose/env files changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" -- docker-compose.yml docker-compose.monitoring.yml backend/Dockerfile frontend/Dockerfile .env.example || true)
          if [ -n "$CHANGED" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Full docker-compose stack (Mongo replica set, Redis, backend, frontend)
      # brought up with `docker compose up --wait` so a breaking change to
      # docker-compose.yml -- a missing env var, a renamed depends_on service,
      # a broken init container -- fails CI instead of only surfacing on a
      # developer's machine or in staging. See issue #1418.
      - name: Bring up full stack
        if: steps.changes.outputs.run == 'true'
        env:
          MONGO_ROOT_USERNAME: ci_root
          MONGO_ROOT_PASSWORD: ci-compose-smoke-password
          JWT_SECRET: ci-compose-smoke-secret
          STELLAR_NETWORK: testnet
          SCHOOL_WALLET_ADDRESS: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
          ADMIN_USERNAME: ci_admin
          ADMIN_PASSWORD: ci-compose-smoke-admin-password
        run: docker compose up -d --wait --wait-timeout 180 backend frontend redis mongo

      - name: Verify backend /health is healthy
        if: steps.changes.outputs.run == 'true'
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
          if [ "$status" != "200" ]; then
            echo "Expected 200 ok from /health, got $status"
            docker compose logs
            exit 1
          fi
          echo "Backend /health returned 200 ok"

      - name: Tear down stack
        if: always() && steps.changes.outputs.run == 'true'
        run: docker compose down -v

  # ── #335: Migration compatibility and rollback tests ────────────────────────
  # Applies all migrations in order on a seeded test database, runs smoke tests
  # after each step, tests every down() function, and verifies that schema state
  # after up()+down() matches the pre-migration state.
  migration-compat:
    name: Migration compatibility & rollback tests
    runs-on: ubuntu-latest
    env:
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      MONGO_URI: mongodb://localhost:27017/stellaredupay_migration_test?replicaSet=rs0
      JWT_SECRET: ci-test-jwt-secret-not-used-in-production
      SCHOOL_WALLET_ADDRESS: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --replSet rs0
          --health-cmd "mongosh --quiet --eval 'try { if (rs.status().ok !== 1) { throw new Error(\"rs not initiated\"); } } catch (e) { try { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"localhost:27017\" }] }); } catch (e2) {} process.exit(1); } if (!db.hello().isWritablePrimary) { process.exit(1); }'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: cd backend && npm ci
      - name: Run migration compatibility & rollback tests
        run: npx jest --testPathPattern=tests/issue-335-migration-compatibility-rollback --forceExit --runInBand
        timeout-minutes: 10

  # ── #338: Cross-browser smoke test matrix ───────────────────────────────────
  # Runs the Playwright smoke test suite against Chromium, Firefox, and WebKit
  # on every PR to main.  Browser-specific failures are reported per-browser
  # so the exact browser causing the failure is visible in the CI summary.
  cross-browser:
    name: Cross-browser smoke test matrix
    runs-on: ubuntu-latest
    # Only run on PRs targeting main (not on feature branch pushes).
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: |
            frontend/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: cd frontend && npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Validate cross-browser config and smoke suite structure
        run: npx jest --testPathPattern=tests/issue-338-cross-browser-smoke-matrix --forceExit
      - name: Run cross-browser smoke tests (Playwright)
        env:
          APP_URL: ${{ vars.STAGING_URL || 'http://localhost:3000' }}
        run: |
          # Start the frontend in the background if no external APP_URL is set
          if [ -z "${{ vars.STAGING_URL }}" ]; then
            cd frontend && NEXT_PUBLIC_API_URL=http://localhost:5000/api npm run build && npm start &
            sleep 10
            cd ..
          fi
          npx playwright test --config=playwright.cross-browser.config.js
        timeout-minutes: 15
        continue-on-error: false
      - name: Upload Playwright report (cross-browser)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-cross-browser-report
          path: reports/cross-browser
          retention-days: 14

  # ── #91: API schema regression ───────────────────────────────────────────
  api-schema-regression:
    name: API schema regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: |
            node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: cd backend && npm ci && cd ..
      - name: Run API schema regression tests
        run: npx jest tests/api-schema/ --forceExit

  # ── #90: Cross-browser smoke matrix ─────────────────────────────────────
  cross-browser-smoke:
    name: Cross-browser smoke matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - name: Run cross-browser smoke matrix
        run: npx jest tests/smoke/ --forceExit
      - name: Upload smoke test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: test-results/smoke/
          retention-days: 7

  # ── #60: Local contract simulation ──────────────────────────────────────
  # Runs representative Soroban contract transaction simulations using the
  # existing Node.js contract services. Catches contract assumption drift
  # before it reaches staging.  Tool version is pinned via the
  # CONTRACT_SIMULATION_TOOLCHAIN env var. The script logs the contract
  # schema version and network configuration so the output is always
  # reproducible from the CI log.
  contract-simulation:
    name: Local contract simulation
    runs-on: ubuntu-latest
    env:
      STELLAR_NETWORK: testnet
      CONTRACT_SIMULATION_TOOLCHAIN: "1.0.0"
      # Dummy values required by config/index.js validation at module load time.
      # No database or real keys are used during simulation.
      JWT_SECRET: ci-contract-simulation-dummy-secret
      MONGO_URI: mongodb://localhost:27017/simulation_dummy
      SCHOOL_WALLET_ADDRESS: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: cd backend && npm ci && cd ..
      - name: Run contract simulations
        run: node scripts/contract-simulation.js

  # ── #1389: Required gate ─────────────────────────────────────────────────
  # A single job that every branch-protection rule needs to require. Add this
  # job name ("CI gate") as the sole required status check in GitHub's branch
  # protection settings for `main`. It fans in `test` and `coverage` so that
  # a Jest coverage-threshold breach blocks the PR just like a test failure
  # does. Add any other must-pass jobs to the `needs` list here rather than
  # registering many individual required checks.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs:
      - version-drift
      - audit
      - secret-scan
      - secret-scan-repo
      - migrations
      - orphan-dirs
      - error-response-shape
      - k8s-ingress-tls
      - lint-backend
      - lint-frontend
      - build-frontend
      - test
      - coverage
      - migration-compat
      - cross-browser
      - api-schema-regression
      - cross-browser-smoke
      - contract-simulation
    steps:
      - run: echo "All required checks passed."
