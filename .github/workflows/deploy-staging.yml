name: Deploy — Staging

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.paymentflow.app
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: Set image tag
        id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to container registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | \
            docker login "${{ secrets.REGISTRY_HOST }}" \
              -u "${{ secrets.REGISTRY_USERNAME }}" \
              --password-stdin

      - name: Pull images for staging
        run: |
          docker pull "${{ secrets.REGISTRY_HOST }}/stellaredupay/backend:${{ steps.meta.outputs.tag }}"
          docker pull "${{ secrets.REGISTRY_HOST }}/stellaredupay/frontend:${{ steps.meta.outputs.tag }}"

      - name: Deploy backend to staging
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST_STAGING }}" \
            "docker pull ${{ secrets.REGISTRY_HOST }}/stellaredupay/backend:${{ steps.meta.outputs.tag }} && \
             docker stop paymentflow-backend-staging || true && \
             docker rm paymentflow-backend-staging || true && \
             docker run -d --name paymentflow-backend-staging \
               --restart unless-stopped \
               -p 5000:5000 \
               -e NODE_ENV=staging \
               -e MONGO_URI=${{ secrets.STAGING_MONGO_URI }} \
               -e JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }} \
               -e STELLAR_NETWORK=testnet \
               -e SCHOOL_WALLET_ADDRESS=${{ secrets.STAGING_SCHOOL_WALLET_ADDRESS }} \
               ${{ secrets.REGISTRY_HOST }}/stellaredupay/backend:${{ steps.meta.outputs.tag }}"

      - name: Deploy frontend to staging
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST_STAGING }}" \
            "docker pull ${{ secrets.REGISTRY_HOST }}/stellaredupay/frontend:${{ steps.meta.outputs.tag }} && \
             docker stop paymentflow-frontend-staging || true && \
             docker rm paymentflow-frontend-staging || true && \
             docker run -d --name paymentflow-frontend-staging \
               --restart unless-stopped \
               -p 3000:3000 \
               -e NEXT_PUBLIC_API_URL=https://staging.paymentflow.app/api \
               ${{ secrets.REGISTRY_HOST }}/stellaredupay/frontend:${{ steps.meta.outputs.tag }}"

      - name: Wait for staging to become ready
        run: |
          for i in $(seq 1 18); do
            if curl -sf "https://staging.paymentflow.app/health/live"; then
              echo ""
              echo "Staging is live"
              exit 0
            fi
            echo "Waiting for staging ($i/18)..."
            sleep 10
          done
          echo "Staging did not become ready within 3 minutes"
          exit 1

  smoke-tests:
    name: Smoke tests (staging)
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: staging
      url: https://staging.paymentflow.app

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm ci

      - name: Run smoke tests against staging
        env:
          SMOKE_TEST_BASE_URL: https://staging.paymentflow.app
        run: node tests/smoke/index.js

      - name: Notify Slack — staging deploy succeeded
        if: success()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \":rocket: *Staging deploy succeeded* — \`${{ env.IMAGE_TAG }}\`\nCommit: ${{ github.sha }}\nActor: ${{ github.actor }}\n<https://staging.paymentflow.app|Open staging>\"
            }"

      - name: Notify Slack — staging smoke tests failed
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \":x: *Staging smoke tests FAILED* — \`${{ env.IMAGE_TAG }}\`\nCommit: ${{ github.sha }}\nActor: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"
            }"
